<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>싱박게임 - 완성판 🍉</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #fff5f5; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; user-select: none; touch-action: none; }
        
        /* UI 상단 정렬 */
        #ui-layer { position: absolute; top: 15px; width: 380px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        
        /* 점수 & 베스트 보드 */
        #score-board { background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 15px; border: 3px solid #ffb7b7; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #score { font-size: 28px; font-weight: bold; color: #ff4757; }
        #best-board { font-size: 14px; font-weight: bold; color: #ffa502; margin-top: 2px; display: flex; align-items: center; }
        
        /* NEXT 미리보기 */
        #next-container { background: rgba(255, 255, 255, 0.9); padding: 8px; border-radius: 15px; border: 3px solid #ffb7b7; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #next-label { font-size: 12px; font-weight: bold; color: #ff4757; margin-bottom: 3px; }
        #next-preview { width: 50px; height: 50px; background-size: cover; background-position: center; border-radius: 50%; margin: 0 auto; }
        
        canvas { border: 4px solid #ffb7b7; border-radius: 10px; background-color: white; max-width: 95vw; max-height: 85vh; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* 게임오버 팝업 */
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        #game-over h1 { font-size: 45px; margin-bottom: 10px; color: #ff4757; text-shadow: 2px 2px black; }
        #game-over button { padding: 12px 25px; font-size: 18px; border-radius: 25px; border: none; background: #ff4757; color: white; cursor: pointer; margin-top: 15px; font-weight: bold; box-shadow: 0 4px 0 #b33939; }
        #game-over button:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="score-board">
            <div id="score">0</div>
            <div id="best-board">🏆 BEST: <span id="best-score">0</span></div>
        </div>
        <div id="next-container">
            <div id="next-label">NEXT</div>
            <div id="next-preview"></div>
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score" style="font-size: 22px;">Score: 0</p>
        <button onclick="location.reload()">RETRY</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: 400, height: 600, wireframes: false, background: '#ffffff' }
        });

        const ground = Bodies.rectangle(200, 650, 600, 100, { isStatic: true, render: { fillStyle: '#ffb7b7' } });
        const leftWall = Bodies.rectangle(-45, 300, 100, 800, { isStatic: true, render: { fillStyle: '#ffb7b7' } });
        const rightWall = Bodies.rectangle(445, 300, 100, 800, { isStatic: true, render: { fillStyle: '#ffb7b7' } });
        const deadLineY = 100;

        Composite.add(engine.world, [ground, leftWall, rightWall]);

        let score = 0;
        let bestScore = localStorage.getItem("singbak_best") || 0;
        document.getElementById("best-score").innerText = bestScore;
        
        let nextFruitIndex = 0; 
        let isInputActive = false;
        let isGameOver = false;

        const FRUITS = [{ r: 25 }, { r: 35 }, { r: 45 }, { r: 55 }, { r: 70 }, { r: 85 }, { r: 100 }, { r: 115 }, { r: 130 }, { r: 145 }, { r: 160 }];
        const textureCache = {};

        function updateNextPreview() {
            const fileName = `싱박${(nextFruitIndex + 1).toString().padStart(2, '0')}.png`;
            document.getElementById('next-preview').style.backgroundImage = `url(${fileName})`;
        }

        function getCircularTexture(index, radius, callback) {
            const fileName = `싱박${(index + 1).toString().padStart(2, '0')}.png`;
            if (textureCache[index]) return callback(textureCache[index]);
            const img = new Image();
            img.src = fileName;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const size = radius * 2;
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.beginPath(); ctx.arc(radius, radius, radius, 0, Math.PI * 2); ctx.clip();
                ctx.drawImage(img, 0, 0, size, size);
                const dataUrl = canvas.toDataURL();
                textureCache[index] = dataUrl;
                callback(dataUrl);
            };
        }

        function addFruit(x, y, index, isStatic = false) {
            if (isGameOver) return null;
            const radius = FRUITS[index].r;
            const fruit = Bodies.circle(x, y, radius, {
                index: index, 
                isStatic: isStatic, 
                restitution: 0.2, 
                friction: 0.1,
                birthTime: Date.now(), // [수정] 생성된 시간 기록
                render: { sprite: { texture: '' } } 
            });
            getCircularTexture(index, radius, (t) => { fruit.render.sprite.texture = t; });
            Composite.add(engine.world, fruit);
            return fruit;
        }

        function updateScoreBoard(amount) {
            score += amount;
            document.getElementById("score").innerText = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("singbak_best", bestScore);
                document.getElementById("best-score").innerText = bestScore;
            }
        }

        function handleStart(clientX) {
            if (isInputActive || isGameOver) return;
            const rect = render.canvas.getBoundingClientRect();
            const x = Math.max(30, Math.min(370, (clientX - rect.left) * (400 / rect.width)));
            isInputActive = true;
            currentFruit = addFruit(x, 50, nextFruitIndex, true);
        }

        function handleMove(clientX) {
            if (isInputActive && currentFruit) {
                const rect = render.canvas.getBoundingClientRect();
                const x = Math.max(30, Math.min(370, (clientX - rect.left) * (400 / rect.width)));
                Body.setPosition(currentFruit, { x: x, y: 50 });
            }
        }

        function handleEnd() {
            if (isInputActive && currentFruit) {
                isInputActive = false;
                Body.setStatic(currentFruit, false);
                updateScoreBoard(10);
                currentFruit = null;
                nextFruitIndex = Math.floor(Math.random() * 4);
                updateNextPreview();
            }
        }

        // 마우스 & 터치 통합
        window.addEventListener("mousedown", (e) => handleStart(e.clientX));
        window.addEventListener("mousemove", (e) => handleMove(e.clientX));
        window.addEventListener("mouseup", handleEnd);
        window.addEventListener("touchstart", (e) => { e.preventDefault(); handleStart(e.touches[0].clientX); }, { passive: false });
        window.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e.touches[0].clientX); }, { passive: false });
        window.addEventListener("touchend", handleEnd);

        Events.on(engine, "collisionStart", (event) => {
            event.pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;
                if (bodyA.index !== undefined && bodyA.index === bodyB.index) {
                    const index = bodyA.index;
                    if (index >= 10) return;
                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;
                    if (Composite.allBodies(engine.world).includes(bodyA) && Composite.allBodies(engine.world).includes(bodyB)) {
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        addFruit(newX, newY, index + 1, false);
                        updateScoreBoard((index + 1) * 20);
                    }
                }
            });
        });

        // 게임오버 로직 보완
        Events.on(engine, "afterUpdate", () => {
            if (isGameOver) return;
            Composite.allBodies(engine.world).forEach(body => {
                if (body.isStatic || body.index === undefined) return;
                
                // [수정] 태어난 지 3초 이상 된 과일들만 게임오버 대상이 됨
                const age = Date.now() - body.birthTime;
                if (age > 3000 && body.position.y < deadLineY) {
                    if (Math.abs(body.velocity.y) < 0.2) {
                        isGameOver = true;
                        document.getElementById("game-over").style.display = "flex";
                        document.getElementById("final-score").innerText = `Final Score: ${score}`;
                    }
                }
            });
        });

        Events.on(render, 'afterRender', () => {
            const ctx = render.context;
            ctx.beginPath(); ctx.moveTo(0, deadLineY); ctx.lineTo(400, deadLineY);
            ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            ctx.stroke(); ctx.setLineDash([]);
        });

        updateNextPreview();
        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
